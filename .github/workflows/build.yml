name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -qo ondas-android.zip

      - name: Número de versión para la app
        run: echo "{\"build\":${{ github.run_number }}}" > ondas-android/app/src/main/assets/www/version.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        working-directory: ondas-android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Ondas-apk
          path: ondas-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Spotifree ${{ github.run_number }}
          files: ondas-android/app/build/outputs/apk/debug/app-debug.apk
          
